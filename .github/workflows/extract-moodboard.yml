name: Extract MULTUM work images
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract five panel images from moodboard
        run: |
          python -m pip install --quiet pillow opencv-python-headless
          python <<'PY'
          from PIL import Image
          import cv2, numpy as np, os

          src = "public/images/Лавандовый футуристический мудборд.png"
          out = "public/images/works"
          os.makedirs(out, exist_ok=True)

          im = Image.open(src).convert("RGB")
          w, h = im.size
          print(f"Moodboard size: {w}x{h}")

          arr = np.array(im)
          gray = cv2.cvtColor(arr, cv2.COLOR_RGB2GRAY)
          gray = cv2.GaussianBlur(gray, (5,5), 0)
          edges = cv2.Canny(gray, 40, 120)
          kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (max(5,w//120), max(5,h//120)))
          closed = cv2.morphologyEx(edges, cv2.MORPH_CLOSE, kernel, iterations=2)
          contours, _ = cv2.findContours(closed, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)

          candidates = []
          for c in contours:
              x,y,cw,ch = cv2.boundingRect(c)
              area = cw*ch
              if cw < w*0.18 or ch < h*0.18 or area < w*h*0.035:
                  continue
              aspect = cw/ch
              if aspect < 0.35 or aspect > 3.5:
                  continue
              fill = cv2.contourArea(c)/area
              candidates.append((area, x,y,cw,ch,fill))

          # Prefer large, well-formed rectangles and suppress heavy overlap.
          candidates.sort(reverse=True)
          chosen=[]
          def iou(a,b):
              _,x1,y1,w1,h1,_=a; _,x2,y2,w2,h2,_=b
              xa=max(x1,x2); ya=max(y1,y2)
              xb=min(x1+w1,x2+w2); yb=min(y1+h1,y2+h2)
              inter=max(0,xb-xa)*max(0,yb-ya)
              union=w1*h1+w2*h2-inter
              return inter/union if union else 0
          for c in candidates:
              if all(iou(c,d) < 0.45 for d in chosen):
                  chosen.append(c)
              if len(chosen) >= 5:
                  break

          # Fallback: generate five balanced crops across the canvas.
          if len(chosen) < 5:
              chosen=[]
              # 3-over-2 and 2-over-3 layouts, pick based on canvas orientation.
              if w >= h:
                  boxes=[
                    (0,0,w//2,h//2),(w//2,0,w,h//2),
                    (0,h//2,w//3,h),(w//3,h//2,2*w//3,h),(2*w//3,h//2,w,h)
                  ]
              else:
                  boxes=[
                    (0,0,w,h//3),(0,h//3,w//2,2*h//3),(w//2,h//3,w,2*h//3),
                    (0,2*h//3,w//2,h),(w//2,2*h//3,w,h)
                  ]
              chosen=[(0,*b,1.0) for b in boxes]

          chosen = sorted(chosen, key=lambda c:(c[2],c[1]))
          print("Chosen boxes:", chosen)

          for i,c in enumerate(chosen[:5],1):
              _,x,y,cw,ch,_=c
              pad=int(min(cw,ch)*0.015)
              x=max(0,x-pad); y=max(0,y-pad)
              cw=min(w-x,cw+2*pad); ch=min(h-y,ch+2*pad)
              crop=im.crop((x,y,x+cw,y+ch))
              crop.save(f"{out}/{i:02d}.png", optimize=True)
              print(f"saved {out}/{i:02d}.png {crop.size}")

          PY
      - name: Commit extracted images
        run: |
          git config user.name "multum-bot"
          git config user.email "multum-bot@users.noreply.github.com"
          git add public/images/works
          git diff --cached --quiet || git commit -m "Extract five work images from lavender moodboard"
          git push
